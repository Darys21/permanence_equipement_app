                                              IfError(DateTime(Year(AuthorizationInput_25.SelectedDate), Month(AuthorizationInput_25.SelectedDate), Day(AuthorizationInput_25.SelectedDate), Value(AuthorizationHour_25.Selected.Value), Value(AuthorizationMinute_25.Selected.Value), 0) < DateTime(Year(RequestInput_25.SelectedDate), Month(RequestInput_25.SelectedDate), Day(RequestInput_25.SelectedDate), Value(RequestHour_25.Selected.Value), Value(RequestMinute_25.Selected.Value), 0), true),
                                              Notify("Travaux : l'Autorisation doit etre posterieure ou egale a la Demande.", NotificationType.Error),
                                              IfError(DateTime(Year(EngagementInput_25.SelectedDate), Month(EngagementInput_25.SelectedDate), Day(EngagementInput_25.SelectedDate), Value(EngagementHour_25.Selected.Value), Value(EngagementMinute_25.Selected.Value), 0) < DateTime(Year(AuthorizationInput_25.SelectedDate), Month(AuthorizationInput_25.SelectedDate), Day(AuthorizationInput_25.SelectedDate), Value(AuthorizationHour_25.Selected.Value), Value(AuthorizationMinute_25.Selected.Value), 0), true),
                                              Notify("Travaux : l'Engagement doit etre posterieur ou egal a l'Autorisation.", NotificationType.Error),
