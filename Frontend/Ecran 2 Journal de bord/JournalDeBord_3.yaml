                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                  Children:
                                    - RegimeLabel_25:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: =Switch(varOngletJournal, "Travaux", "Régime de travaux", "LTV", "Motif ralentissement", "Incidents", "Localisation type")
                                    - RegimeInput_25:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Sélectionner le régime de travaux"
                                          BorderColor: =If(varAttemptedSave && IsBlank(RegimeInput_25.Selected), RGBA(238, 32, 35, 1), RGBA(180, 185, 195, 1))
                                          DefaultSelectedItems: |-
                                            =If(
                                                varActionEnCours = "Modifier",
                                                Filter(
                                                    Switch(
                                                        varOngletJournal,
                                                        "Travaux", Choices(Tx_Travaux.Regime_travaux),
                                                        "LTV", Choices(Tx_LTV.Motif_Ralentissement),
                                                        Choices(Tx_incidents_Ruptures.Localisation_Type)
                                                    ),
                                                    Value = Switch(
                                                        varOngletJournal,
                                                        "Travaux", varTravauxToEdit.Regime_travaux.Value,
                                                        "LTV", Coalesce(varLtvToEdit.Motif_Ralentissement.Value, varLtvToEdit.Motif_Ralentissement.Value),
                                                        varIncidentToEdit.Localisation_Type.Value
                                                    )
                                                ),
                                                Blank()
                                            )
                                          DisplayFields: =["Value"]
                                          FocusedBorderThickness: =2
                                          Height: =38
                                          InputTextPlaceholder: ="Find items"
                                          IsSearchable: =false
                                          Items: |-
                                            =Switch(
                                                varOngletJournal,
                                                "Travaux", SortByColumns(Choices(Tx_Travaux.Regime_travaux), "Value", SortOrder.Ascending),
                                                "LTV", SortByColumns(Choices(Tx_LTV.Motif_Ralentissement), "Value", SortOrder.Ascending),
                                                "Incidents", SortByColumns(Choices(Tx_incidents_Ruptures.Localisation_Type), "Value", SortOrder.Ascending),
                                                SortByColumns(Choices(Tx_Travaux.Regime_travaux), "Value", SortOrder.Ascending)
                                            )
                                          OnChange: =Reset(LockTimer_JB)
                                          OnSelect: =Reset(LockTimer_JB)
                                          SearchFields: =["Value"]
                                          SelectMultiple: =false
