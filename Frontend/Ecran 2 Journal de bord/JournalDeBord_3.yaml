                                                        PK_Debut: With({_s: Split(PKDebutInput_24.Text, "+")}, If(CountRows(_s) = 2, Value(First(_s).Value) + Value(Last(_s).Value)/1000, IfError(Value(PKDebutInput_24.Text), Blank()))),
