Screens:
  JournalDeBord_3:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(8, 49, 120, 1)
      OnVisible: |-
        =Reset(LockTimer_JB);
        Set(varLockInputSnapshot_JB, Concatenate(
                      Coalesce(TitreChantierInput_25.Text, ""), Char(10),
                      Coalesce(PKDebutInput_24.Text, ""), Char(10),
                      Coalesce(PKFinInput_24.Text, ""), Char(10),
                      Coalesce(TauxInput_24.Text, ""), Char(10),
                      Coalesce(CommentairesInput_24.Text, "")
                  ));
        If(varActionEnCours <> "Modifier", Set(varOngletJournal, "Travaux"));
        Set(varAttemptedSave, false);
        Refresh(Ref_Cantons);
        Refresh(Ref_Acteurs);
        Refresh(Ref_Permanents);
        Refresh(Tx_Travaux);
        Refresh(Tx_LTV);
        Refresh(Tx_incidents_Ruptures);
        Refresh(Tx_Feedbacks);
        If(IsBlank(varActionEnCours), Set(varActionEnCours, "Créer"))
    Children:
      - conRoot_Responsive_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingLeft: =If(App.Width < 760, 12, 24)
            PaddingRight: =If(App.Width < 760, 12, 24)
            PaddingTop: =12
            Width: =App.Width
          Children:
            - Header_29:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(8, 49, 120, 1)
                  FillPortions: =0
                  Height: =76
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(App.Width < 760, 8, 16)
                  LayoutMinHeight: =76
                  PaddingLeft: =If(App.Width < 760, 12, 20)
                  PaddingRight: =If(App.Width < 760, 12, 20)
                Children:
                  - LogoMark_28:
                      Control: Rectangle@2.3.0
                      Properties:
                        AccessibleLabel: ="Logo SETRAG"
                        Fill: =RGBA(255, 184, 0, 1)
                        Height: =5
                        TabIndex: =0
                        Width: =59
                  - LogoText_32:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(App.Width >= 900, 0, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =60
                        Size: =15
                        TabIndex: =0
                        Text: ="SETRAG" & Char(10) & "   ERAMET"
                        Visible: =App.Width >= 760
                        Width: =130
                  - ScreenTitle_25:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =76
                        Size: =If(App.Width < 1100, 17, 24)
                        TabIndex: =0
                        Text: ="JOURNAL DE BORD OPÉRATIONNEL"
                        Visible: =App.Width >= 900
                  - SessionGroup_25:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =If(App.Width >= 900, 0, 1)
                        Height: =44
                        LayoutMinWidth: =If(App.Width < 760, 110, 340)
                        Width: =If(App.Width < 1100, 340, 440)
                      Children:
                        - HomeFromDashboard_25:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =2
                              Height: =Parent.Height
                              OnSelect: =Reset(LockTimer_JB); Navigate(PrisePoste_2_backup, ScreenTransition.Fade)
                              Size: =13.7
                              Text: ="Retour à la prise de poste"
                              Tooltip: ="Retour à la prise de poste"
                              Width: =Parent.Width
                        - SessionInfo_25:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(255, 255, 255, 1)
                              BorderThickness: =1
                              Color: =RGBA(255, 255, 255, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height
                              Size: =If(App.Width < 760, 10, 13)
                              TabIndex: =0
                              Text: |-
                                ="Poste : " &
                                Coalesce(varQuart, "Non défini") &
                                "   |   Agent : " &
                                Coalesce(varAgentPermanentNom, "Aucun agent sélectionné")
                              Width: =Parent.Width
                  - BtnLock_JB:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(255, 174, 0, 1)
                        BorderThickness: =1
                        Color: =RGBA(8, 49, 120, 1)
                        Fill: =RGBA(255, 174, 0, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =34
                        LayoutMinWidth: =40
                        OnSelect: |-
                          =Set(varSessionVerrouillee, true);
                          Set(varLockSource, "Manuel");
                          Set(LockPinInvalid_JB, false);
                          Reset(LockPin_JB)
                        Size: =16
                        Text: |-
                          ="🔒"
                        Tooltip: ="Verrouiller la session sans la fermer"
                        Visible: =!IsBlank(varSessionPoste) && !varSessionVerrouillee
                        Width: =40
                  - BtnChangerAgent_25:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(255, 255, 255, 1)
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(8, 49, 120, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =36
                        OnSelect: |-
                          =Reset(LockTimer_JB);
                          If(
                              !IsBlank(varAgentPermanentID),
                              Patch(
                                  Ref_Permanents,
                                  LookUp(Ref_Permanents, ID = varAgentPermanentID),
                                  {Actif: {Value: "Non"}}
                              )
                          );
                          Set(varAgentPermanent, Blank());
                          Set(varAgentPermanentID, Blank());
                          Set(varAgentPermanentNom, Blank());
                          Refresh(Ref_Permanents);
                          Navigate(scrIdentificationAgent, ScreenTransition.Fade)
                        Size: =If(App.Width < 760, 10, 12)
                        Text: ="Changer d'agent"
                        Tooltip: ="Revenir à l'identification pour sélectionner un autre permanent"
                        Width: =If(App.Width < 760, 96, 130)
            - Tabs_25:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =4
                  LayoutMinHeight: =56
                Children:
                  - TabTravaux_25:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(varOngletJournal = "Travaux", RGBA(255, 174, 0, 1), RGBA(230, 230, 230, 1))
                        BorderThickness: =If(varOngletJournal = "Travaux", 2, 1)
                        Color: =If(varOngletJournal = "Travaux", RGBA(255, 255, 255, 1), RGBA(68, 73, 87, 1))
                        Fill: =If(varOngletJournal = "Travaux", RGBA(8, 49, 120, 1), RGBA(248, 249, 251, 1))
                        FillPortions: =If(App.Width < 1100, 1, 0)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height
                        OnSelect: |-
                          =Reset(LockTimer_JB);
                          Set(varOngletJournal, "Travaux");
                          Set(varAttemptedSave, false)
                        Size: =If(App.Width < 760, 12, 16)
                        Text: =If(App.Width < 760, "1. Travaux", "1. Chantiers & Travaux")
                        Width: =340
                  - TabLTV_25:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(varOngletJournal = "LTV", RGBA(255, 174, 0, 1), RGBA(230, 230, 230, 1))
                        BorderThickness: =If(varOngletJournal = "LTV", 2, 1)
                        Color: =If(varOngletJournal = "LTV", RGBA(255, 255, 255, 1), RGBA(68, 73, 87, 1))
                        Fill: =If(varOngletJournal = "LTV", RGBA(8, 49, 120, 1), RGBA(248, 249, 251, 1))
                        FillPortions: =If(App.Width < 1100, 1, 0)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height
                        OnSelect: |-
                          =Reset(LockTimer_JB);
                          Set(varOngletJournal, "LTV");
                          Set(varAttemptedSave, false)
                        Size: =If(App.Width < 760, 12, 16)
                        Text: =If(App.Width < 760, "2. LTV / RAL", "2. LTV / RAL (Ralentissements)")
                        Width: =340
                  - TabIncidents_25:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(varOngletJournal = "Incidents", RGBA(255, 174, 0, 1), RGBA(230, 230, 230, 1))
                        BorderThickness: =If(varOngletJournal = "Incidents", 2, 1)
                        Color: =If(varOngletJournal = "Incidents", RGBA(255, 255, 255, 1), RGBA(68, 73, 87, 1))
                        Fill: =If(varOngletJournal = "Incidents", RGBA(8, 49, 120, 1), RGBA(248, 249, 251, 1))
                        FillPortions: =If(App.Width < 1100, 1, 0)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height
                        OnSelect: |-
                          =Reset(LockTimer_JB);
                          Set(varOngletJournal, "Incidents");
                          Set(varAttemptedSave, false)
                        Size: =If(App.Width < 760, 12, 16)
                        Text: =If(App.Width < 760, "3. Incidents", "3. Incidents & Ruptures")
                        Width: =340
            - Workspace_25:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 1000, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =If(App.Width < 1000, 1700, 640)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                Children:
                  - FormPanel_25:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(230, 232, 236, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(App.Width < 1000, 3, 55)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinWidth: =300
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                      Children:
                        - FormTitle_25:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              Size: =If(App.Width < 760, 15, 18)
                              TabIndex: =0
                              Text: =If(varOngletJournal = "Travaux", "SAISIE D’UN CHANTIER / TRAVAUX", If(varOngletJournal = "LTV", "SAISIE LTV / RAL", "SAISIE INCIDENT / RUPTURE"))
                        - FormRule_25:
                            Control: Rectangle@2.3.0
                            Properties:
                              AccessibleLabel: ="Separateur du formulaire"
                              Fill: =If(varOngletJournal = "Incidents", RGBA(238, 32, 35, 1), If(varOngletJournal = "LTV", RGBA(255, 174, 0, 1), RGBA(8, 49, 120, 1)))
                              Height: =2
                              TabIndex: =0
                        - FormFlow_25:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              LayoutWrap: =true
                              PaddingRight: =8
                            Children:
                              - LocationHeading_25:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinWidth: =Parent.Width - 24
                                    TabIndex: =0
                                    Text: ="1. LOCALISATION"
                              - FldDivision_25:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                  Children:
                                    - DivisionLabel_25:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Division"
                                    - DivisionInput_25:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Sélectionner une division"
                                          BorderColor: =If(varAttemptedSave && IsBlank(DivisionInput_25.Selected), RGBA(238, 32, 35, 1), RGBA(180, 185, 195, 1))
                                          DefaultSelectedItems: |-
                                            =If(
                                                varActionEnCours = "Modifier",
                                                With(
                                                    {_cantonId: If(
                                                        varOngletJournal = "Travaux", varTravauxToEdit.'CantonID ',
                                                        varOngletJournal = "LTV", varLtvToEdit.CantonID.Id,
                                                        varIncidentToEdit.CantonID.Id
                                                    )},
                                                    Filter(
                                                        Choices(Ref_Cantons.Division),
                                                        Value in Coalesce(LookUp(Ref_Cantons, ID = _cantonId, Division.Value), Blank())
                                                    )
                                                ),
                                                Blank()
                                            )
                                          DisplayFields: =["Value"]
                                          FocusedBorderThickness: =2
                                          Height: =38
                                          InputTextPlaceholder: ="Find items"
                                          IsSearchable: =false
                                          Items: =Choices(Ref_Cantons.Division)
                                          OnChange: =Reset(LockTimer_JB)
                                          OnSelect: =Reset(LockTimer_JB)
                                          SearchFields: =["Value"]
                                          SelectMultiple: =false
                              - FldCanton_25:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                  Children:
                                    - CantonLabel_25:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Canton"
                                    - CantonInput_25:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Sélectionner un canton"
                                          BorderColor: =If(varAttemptedSave && IsBlank(CantonInput_25.Selected), RGBA(238, 32, 35, 1), RGBA(180, 185, 195, 1))
                                          DefaultSelectedItems: |-
                                            =If(
                                                varActionEnCours = "Modifier",
                                                Filter(
                                                    Ref_Cantons,
                                                    ID = If(
                                                        varOngletJournal = "Travaux", varTravauxToEdit.'CantonID ',
                                                        varOngletJournal = "LTV", varLtvToEdit.CantonID.Id,
                                                        varIncidentToEdit.CantonID.Id
                                                    )
                                                ),
                                                Blank()
                                            )
                                          DisplayFields: =["Title"]
                                          FocusedBorderThickness: =2
                                          Height: =38
                                          InputTextPlaceholder: ="Sélectionner un canton"
                                          IsSearchable: =false
                                          Items: |-
                                            =Filter(
                                                Ref_Cantons,
                                                DivisionInput_25.Selected.Value in Division.Value
                                            )
                                          OnChange: =Reset(LockTimer_JB)
                                          OnSelect: =Reset(LockTimer_JB)
                                          SearchFields: =["Title"]
                                          SelectMultiple: =false
                              - DetailsHeading_24:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinWidth: =Parent.Width - 24
                                    TabIndex: =0
                                    Text: ="2. DÉTAILS SPÉCIFIQUES"
