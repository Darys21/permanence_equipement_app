                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                    Visible: =varOngletJournal = "Travaux" || varOngletJournal = "LTV"
                                  Children:
                                    - ActorLabel_25:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Responsable intervenant"
                                    - ActorInput_25:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Sélectionner le responsable intervenant (CDT, CDI, CBA)"
                                          BorderColor: =If(varAttemptedSave && (varOngletJournal = "Travaux" || varOngletJournal = "LTV") && IsBlank(ActorInput_25.Selected), RGBA(238, 32, 35, 1), RGBA(180, 185, 195, 1))
