      - LockTimer_JB:
          Control: Timer@2.1.0
          Properties:
            Duration: =600000
            Height: =1
            OnTimerEnd: |-
              =If(
                  !varSessionVerrouillee && !IsBlank(varSessionPoste),
                  Set(varSessionVerrouillee, true);
                  Set(varLockSource, "Automatique");
                  Set(LockPinInvalid_JB, false);
                  Reset(LockPin_JB)
              )
            Start: =!varSessionVerrouillee && !IsBlank(varSessionPoste)
            Visible: =false
            Width: =1
      - LockInputPoll_JB:
          Control: Timer@2.1.0
          Properties:
            Duration: =1000
            Height: =1
            OnTimerEnd: |-
              =If(
                  varLockInputSnapshot_JB <> Concatenate(
                                        Coalesce(TitreChantierInput_25.Text, ""), Char(10),
                                        Coalesce(PKDebutInput_24.Text, ""), Char(10),
                                        Coalesce(PKFinInput_24.Text, ""), Char(10),
                                        Coalesce(TauxInput_24.Text, ""), Char(10),
                                        Coalesce(CommentairesInput_24.Text, "")
                                    ),
                  Set(varLockInputSnapshot_JB, Concatenate(
                                        Coalesce(TitreChantierInput_25.Text, ""), Char(10),
                                        Coalesce(PKDebutInput_24.Text, ""), Char(10),
                                        Coalesce(PKFinInput_24.Text, ""), Char(10),
                                        Coalesce(TauxInput_24.Text, ""), Char(10),
                                        Coalesce(CommentairesInput_24.Text, "")
                                    ));
                  Reset(LockTimer_JB)
              )
            Repeat: =true
            Start: =!varSessionVerrouillee && !IsBlank(varSessionPoste)
            Visible: =false
            Width: =1
