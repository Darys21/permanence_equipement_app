                                            =If(
                                                varActionEnCours = "Modifier" && (varOngletJournal = "Travaux" || varOngletJournal = "LTV"),
                                                Filter(
                                                    Ref_Acteurs,
                                                    ID = If(
                                                        varOngletJournal = "Travaux", varTravauxToEdit.'ActeurID ',
                                                        varLtvToEdit.ActeurID.Id
                                                    )
                                                ),
                                                Blank()
                                            )
