                                            =SortByColumns(
                                                Filter(
                                                    Ref_Permanents,
                                                    Actif.Value = "Oui"
                                                ),
                                                "Title",
                                                SortOrder.Ascending
                                            )
                                          OnChange: =Reset(LockTimer_JB)
                                          OnSelect: =Reset(LockTimer_JB)
                                          SearchFields: =["Title"]
                                          SelectMultiple: =false
                              - FldTitre_25:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                    Visible: =varOngletJournal = "Travaux"
                                  Children:
                                    - TitreChantierLabel_25:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Nature des travaux"
                                    - TitreChantierInput_25:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
