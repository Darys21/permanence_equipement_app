                                      If(
                                          If(
                                              varActionEnCours = "Modifier",
                                              Switch(
                                                  varOngletJournal,
                                                  "Travaux", IsBlank(LookUp(Tx_Travaux, ID = varTravauxToEdit.ID, ID)),
                                                  "LTV", IsBlank(LookUp(Tx_LTV, ID = varLtvToEdit.ID, ID)),
