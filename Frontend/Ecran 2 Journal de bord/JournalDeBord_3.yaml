                                          FocusedBorderThickness: =2
                                          Height: =38
                                          InputTextPlaceholder: ="CDT / CDI / CBA (terrain)"
                                          IsSearchable: =false
                                          Items: =Ref_Acteurs
                                          OnChange: =Reset(LockTimer_JB)
                                          OnSelect: =Reset(LockTimer_JB)
                                          SearchFields: =["Title"]
                                          SelectMultiple: =false
                              - FldPermanent_24:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                    Visible: =varOngletJournal = "Travaux" || varOngletJournal = "LTV"
                                  Children:
                                    - PermanentLabel_24:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Permanent au poste"
                                    - PermanentInput_24:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Sélectionner le permanent au poste"
                                          BorderColor: =RGBA(180, 185, 195, 1)
                                          DefaultSelectedItems: |-
                                            =If(
                                                !IsBlank(varAgentPermanentID),
                                                Filter(
                                                    Ref_Permanents,
                                                    ID = varAgentPermanentID
                                                ),
                                                Blank()
                                            )
                                          DisplayFields: =["Title"]
