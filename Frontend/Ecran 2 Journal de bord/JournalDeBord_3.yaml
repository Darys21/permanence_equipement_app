                                                      Heure_Fin: If(IsBlank(HeureFinIncidentInput_22.SelectedDate), Blank(), DateTime(Year(HeureFinIncidentInput_22.SelectedDate), Month(HeureFinIncidentInput_22.SelectedDate), Day(HeureFinIncidentInput_22.SelectedDate), Value(HeureFinIncidentHour_22.Selected.Value), Value(HeureFinIncidentMinute_22.Selected.Value), 0)),
                                                      Etat: {Value: If(varActionEnCours = "Modifier" && HeureFinIncidentInput_22.SelectedDate = DateValue(varIncidentToEdit.Heure_Fin), varIncidentToEdit.Etat.Value, If(IsBlank(HeureFinIncidentInput_22.SelectedDate), "En cours", "Traitée"))},
                                                      Commentaires: CommentairesInput_24.Text,
