                                          Notify("Format PK invalide. Utilisez uniquement le format 12+400 (pas de virgule ni de point).", NotificationType.Error),
                                          IsBlank(DivisionInput_25.Selected),
                                          Notify("Division obligatoire.", NotificationType.Error),
                                          IsBlank(CantonInput_25.Selected),
                                          Notify("Canton obligatoire.", NotificationType.Error),
                                          If(
                                          varOngletJournal = "Travaux",
                                          If(
                                              IsBlank(Trim(TitreChantierInput_25.Text)),
                                              Notify("Travaux : la Nature des travaux est obligatoire.", NotificationType.Error),
                                              IsBlank(PKDebutInput_24.Text),
                                              Notify("Travaux : le PK début est obligatoire.", NotificationType.Error),
                                              IsBlank(RegimeInput_25.Selected),
                                              Notify("Travaux : le Régime de travaux est obligatoire.", NotificationType.Error),
                                              IsBlank(ActorInput_25.Selected),
                                              Notify("Travaux : l'Intervenant est obligatoire.", NotificationType.Error),
