                        Height: =43
                        OnSelect: |-
                          =If(
                              IsBlank(DivisionInput_8.Selected) || IsBlank(CantonInput_8.Selected),
                              Notify("Sélectionnez Division et Canton.", NotificationType.Error),
                              If(
                              varOngletJournal = "Travaux",
                              If(
                                  IsBlank(RegimeInput_8.Selected) || IsBlank(ActorInput_8.Selected) ||
                                  IsBlank(IfError(DateTimeValue(RequestInput_8.Text), Blank())) ||
                                  IsBlank(IfError(DateTimeValue(AuthorizationInput_8.Text), Blank())) ||
                                  IsBlank(IfError(DateTimeValue(EngagementInput_8.Text), Blank())) ||
                                  IfError(DateTimeValue(AuthorizationInput_8.Text) < DateTimeValue(RequestInput_8.Text), true) ||
                                  IfError(DateTimeValue(EngagementInput_8.Text) < DateTimeValue(AuthorizationInput_8.Text), true),
                                   Notify("Travaux : renseignez régime, intervenant, 3 heures et vérifiez chronologie (Demande ≤ Autorisée ≤ Engagement).", NotificationType.Error),
                                   IfError(
                                     Patch(
                                        Tx_Travaux,
                                        Defaults(Tx_Travaux),
                                        {
                                            Title: "Chantier - " & Text(Now(), "yyyymmdd-hhmm"),
                                            Datetravaux: Today(),
                                            CantonID: CantonInput_8.Selected.ID,
                                            R_x00e9_gimetravaux: {Value: RegimeInput_8.Selected.Value},
                                            ActeurID: ActorInput_8.Selected.ID,
                                            Heure_demande: DateTimeValue(RequestInput_8.Text),
                                            Heure_Fin_Prevue: IfError(DateTimeValue(FinPrevueInput_7.Text), Blank()),
                                            Heures_Autorisee: DateTimeValue(AuthorizationInput_8.Text),
                                            Heure_engagement: DateTimeValue(EngagementInput_8.Text),
                                            Heures_Degagement: IfError(DateTimeValue(DegagementInput_7.Text), Blank()),
                                            Heures_Voie_Retablie: IfError(DateTimeValue(VoieRetablieInput_7.Text), Blank()),
                                            PK_Debut: With({_s: Split(PKDebutInput_7.Text, "+")}, If(CountRows(_s) = 2, Value(First(_s).Value) + Value(Last(_s).Value)/1000, IfError(Value(PKDebutInput_7.Text), Blank()))),
                                            PK_Fin: With({_s: Split(PKFinInput_7.Text, "+")}, If(CountRows(_s) = 2, Value(First(_s).Value) + Value(Last(_s).Value)/1000, IfError(Value(PKFinInput_7.Text), Blank()))),
                                            Motif_Engagement: MotifEngagementInput_7.Text,
                                            Motifs_Engagement_Tardif: MotifEngTardifInput_7.Text,
                                            Motif_Degagement_Tardif: MotifDegTardifInput_7.Text,
                                            Poste: {Value: varQuart},
                                            AgentSaisie: {Claims: "i:0#.f|membership|" & Lower(User().Email), DisplayName: User().FullName, Email: User().Email, Department: "", JobTitle: "", Picture: ""},
                                            DateSaisie: Now()
                                        }
                                  ),
                                  Notify("Erreur écriture Tx_Travaux : " & FirstError.Message, NotificationType.Error),
                                  Notify("Chantier enregistré dans Tx_Travaux", NotificationType.Success)
                                          )
                              ),
                              varOngletJournal = "LTV",
                              If(
                                  IsBlank(RegimeInput_8.Selected) || IsBlank(ActorInput_8.Selected) || IsBlank(PKDebutInput_7.Text) || IsBlank(TauxInput_7.Text),
                                   Notify("LTV : renseignez motif, intervenant, PK début et taux.", NotificationType.Error),
                                   IfError(
                                    Patch(
                                        Tx_LTV,
                                        Defaults(Tx_LTV),
                                        {
                                            Title: "LTV - " & Text(Now(), "yyyymmdd-hhmm"),
                                            Motif_Ralentissement:{Value: RegimeInput_8.Selected.Value},
                                            CantonID_: {Id: CantonInput_8.Selected.ID, Value: CantonInput_8.Selected.Title},
                                            PK_Debut: With({_s: Split(PKDebutInput_7.Text, "+")}, If(CountRows(_s) = 2, Value(First(_s).Value) + Value(Last(_s).Value)/1000, IfError(Value(PKDebutInput_7.Text), Blank()))),
                                            PK_Fin: With({_s: Split(PKFinInput_7.Text, "+")}, If(CountRows(_s) = 2, Value(First(_s).Value) + Value(Last(_s).Value)/1000, IfError(Value(PKFinInput_7.Text), Blank()))),
                                            Taux: IfError(Value(TauxInput_7.Text), Blank()),
                                            ActeurID0: {Id: ActorInput_8.Selected.ID, Value: ActorInput_8.Selected.Title},
                                            Statut_LTV: {Value: If(IsBlank(DateSuppressionInput_7.Text), "Imposée", "Supprimée")},
                                            Date_imposition: DateTimeValue(DateIncidentInput_7.Text),
                                            Date_Suppression: IfError(DateTimeValue(DateSuppressionInput_7.Text), Blank()),
                                            Poste: {Value: varQuart},
                                            AgentSaisie: {Claims: "i:0#.f|membership|" & Lower(User().Email), DisplayName: User().FullName, Email: User().Email, Department: "", JobTitle: "", Picture: ""},
                                            DateSaisie: Now()
                                        }
                                  ),
                                  Notify("Erreur écriture Tx_LTV : " & FirstError.Message, NotificationType.Error),
                                  Notify("LTV enregistrée dans Tx_LTV", NotificationType.Success)
                                  )
                              ),
                              If(
                                  IsBlank(RegimeInput_8.Selected) || IsBlank(PKDebutInput_7.Text),
                                  Notify("Incidents : renseignez localisation type et PK.", NotificationType.Error),
                                  IfError(
                                  Patch(
                                      Tx_incidents_Ruptures,
                                      Defaults(Tx_incidents_Ruptures),
                                      {
                                          Title: "Incident - " & Text(Now(), "yyyymmdd-hhmm"),
                                          DateIncident: IfError(DateTimeValue(DateIncidentInput_7.Text), Today()),
                                          CantonID0: {Id: CantonInput_8.Selected.ID, Value: CantonInput_8.Selected.Title},
                                          PK: PKDebutInput_7.Text,
                                          Localisation_Type: {Value: RegimeInput_8.Selected.Value},
                                          Heure_D_x00e9_but: IfError(DateTimeValue(RequestInput_8.Text), Now()),
                                          Heure_Fin: HeureFinIncidentInput_5.SelectedDate,
                                          Etat: {Value: If(IsBlank(HeureFinIncidentInput_5.SelectedDate), "En cours", "Traitée")},
                                          Commentaires: CommentairesInput_7.Text,
                                          Poste: {Value: varQuart},
                                          AgentSaisie: {Claims: "i:0#.f|membership|" & Lower(User().Email), DisplayName: User().FullName, Email: User().Email, Department: "", JobTitle: "", Picture: ""},
                                          DateSaisie: Now()
                                      }
                                  ),
                                  Notify("Erreur écriture Tx_incidents : " & FirstError.Message, NotificationType.Error),
                                  Notify("Incident enregistré dans Tx_incidents_Ruptures", NotificationType.Success)
                                  )
                              )
                            )
