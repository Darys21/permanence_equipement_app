                                      "════════════════════════════════════════" & Char(10) &
                                      "Poste : " & Coalesce(varQuart, "Non défini") & Char(10) &
                                      "Période : " & Switch(
                                          varQuart,
                                          "P1", "06h00 - 14h00",
                                          "P2", "14h00 - 22h00",
                                          "P3", "22h00 - 06h00",
                                          varQuart
                                      ) & Char(10) &
                                      "Date du rapport : " & Text(Today(), "dd/mm/yyyy") & Char(10) &
                                      "Agent responsable : " & Coalesce(varAgentPermanentNom, "Non renseigné") & Char(10) &
                                      Char(10) &
                                      "1. BILAN DE L'ACTIVITÉ" & Char(10) &
                                      "────────────────────────────────────────" & Char(10) &
                                      "Travaux enregistrés : " &
                                      CountRows(
                                          Filter(
                                              Tx_Travaux,
                                              Poste.Value = varQuart &&
                                              Date_travaux = Today()
                                          )
                                      ) & Char(10) &
                                      "Travaux sans dégagement : " &
                                      CountRows(
                                          Filter(
                                              Tx_Travaux,
                                              Poste.Value = varQuart &&
                                              IsBlank(Heures_Degagement)
                                          )
                                      ) & Char(10) &
                                      "LTV imposées aujourd'hui : " &
                                      CountRows(
                                          Filter(
                                              Tx_LTV,
                                              'Poste '.Value = varQuart &&
                                              'Date_imposition ' >= Today() &&
                                              'Date_imposition ' < DateAdd(Today(), 1, TimeUnit.Days)
                                          )
                                      ) & Char(10) &
                                      "LTV actuellement imposées : " &
                                      CountRows(
                                          Filter(
                                              Tx_LTV,
                                              'Poste '.Value = varQuart &&
                                              Statut_LTV.Value = "Imposée"
                                          )
                                      ) & Char(10) &
                                      "Incidents enregistrés aujourd'hui : " &
                                      CountRows(
                                          Filter(
                                              Tx_incidents_Ruptures,
                                              Poste.Value = varQuart &&
                                              DateIncident >= Today() &&
                                              DateIncident < DateAdd(Today(), 1, TimeUnit.Days)
                                          )
                                      ) & Char(10) &
                                      "Incidents non clôturés : " &
                                      CountRows(
                                          Filter(
                                              Tx_incidents_Ruptures,
                                              Poste.Value = varQuart &&
                                              (Etat.Value = "En cours" || IsBlank(Heure_Fin))
                                          )
                                      ) & Char(10) &
                                      "Feedbacks terrain enregistrés : " &
                                      CountRows(
                                          Filter(
                                              Tx_Feedbacks,
                                              Poste.Value = varQuart &&
                                              HeureContact >= Today() &&
                                              HeureContact < DateAdd(Today(), 1, TimeUnit.Days)
                                          )
                                      ) & Char(10) &
                                      Char(10) &
                                      "2. TRANSMISSION AU POSTE SUIVANT" & Char(10) &
                                      "────────────────────────────────────────" & Char(10) &
                                      "Poste destinataire : " &
                                      Coalesce(NextShift_5.Selected.Value, "Non renseigné") & Char(10) &
                                      Char(10) &
                                      "3. COMMENTAIRES ET CONSIGNES" & Char(10) &
                                      "────────────────────────────────────────" & Char(10) &
                                      Coalesce(ClosureComment_5.Text, "(Aucun commentaire renseigné)") & Char(10) &
                                      Char(10) &
                                      "════════════════════════════════════════" & Char(10) &
                                      "Fin du rapport de poste"
                  - ConfirmationPanel_5:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(230, 232, 236, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinWidth: =280
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =varEtapeCloture = 3
                      Children:
                        - ConfirmationTitle_5:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              Size: =16
                              Text: ="CONFIRMATION DE LA CLÔTURE"
                        - ConfirmationSummary_5:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 73, 87, 1)
                              FillPortions: =1
                              LayoutMinHeight: =260
                              PaddingLeft: =8
                              Text: |-
                                ="Poste : " & varQuart & Char(10) &
                                "Agent : " & Coalesce(varAgentPermanentNom, "Aucun agent sélectionné") & Char(10) &
                                "Travaux du poste : " & CountRows(Filter(Tx_Travaux, Poste.Value = varQuart && Date_travaux = Today())) & Char(10) &
                                "Travaux encore en cours : " & CountRows(Filter(Tx_Travaux, Poste.Value = varQuart && IsBlank(Heures_Degagement))) & Char(10) &
                                "LTV actives : " & CountRows(Filter(Tx_LTV, 'Poste '.Value = varQuart && Statut_LTV.Value = "Imposée")) & Char(10) &
                                "Incidents ouverts : " & CountRows(Filter(Tx_incidents_Ruptures, Poste.Value = varQuart && (Etat.Value = "En cours" || IsBlank(Heure_Fin)))) & Char(10) &
                                "Feedbacks terrain : " & CountRows(Filter(Tx_Feedbacks, Poste.Value = varQuart && HeureContact >= Today() && HeureContact < DateAdd(Today(), 1, TimeUnit.Days))) & Char(10) &
                                "Poste suivant : " & Coalesce(NextShift_5.Selected.Value, "Non renseigné") & Char(10) &
                                Char(10) &
                                "Commentaire : " & Coalesce(ClosureComment_5.Text, "Aucun commentaire")
                        - ConfirmationNotice_5:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(125, 78, 0, 1)
                              Fill: =RGBA(255, 248, 232, 1)
                              Height: =If(App.Width < 760, 100, 70)
                              PaddingLeft: =8
                              Size: =12
                              Text: ="Vérifiez ces informations avant de cliquer sur « VALIDER & CLÔTURER LE POSTE ». Les événements en cours seront transmis au poste suivant."
            - Footer_CL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 760, 112, 64)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 760, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =If(App.Width < 760, 112, 64)
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - ClosureBack_5:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(8, 49, 120, 1)
                        BorderThickness: =1
                        Color: =RGBA(8, 49, 120, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =48
                        OnSelect: =Reset(LockTimer_CL); Navigate(JournalDeBord_3, ScreenTransition.Fade)
                        Size: =If(App.Width < 760, 12, 14)
                        Text: ="←   RETOUR AU JOURNAL DE BORD"
                        Width: =If(App.Width < 760, 300, 340)
                  - ValidateClosure_5:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Fill: =RGBA(255, 174, 0, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =48
                        OnSelect: |-
                          =Reset(LockTimer_CL);
                          If(
                              varEtapeCloture < 3,
                              Set(varEtapeCloture, varEtapeCloture + 1),
                              If(
                                  IsBlank(varAgentPermanentID),
                                  Notify(
                                      "Impossible de clôturer : aucun permanent connecté n'a été identifié.",
                                      NotificationType.Error
                                  ),
                                  With(
                                      {
                                          _nextPoste: If(
                                              !IsBlank(NextShift_5.Selected) && StartsWith(Text(NextShift_5.Selected.Value), "P3"),
                                              "P3",
                                              If(
                                                  !IsBlank(NextShift_5.Selected) && StartsWith(Text(NextShift_5.Selected.Value), "P2"),
                                                  "P2",
                                                  If(
                                                      !IsBlank(NextShift_5.Selected) && StartsWith(Text(NextShift_5.Selected.Value), "P1"),
                                                      "P1",
                                                      Switch(varQuart, "P1", "P2", "P2", "P3", "P3", "P1", "P1")
                                                  )
                                              )
                                          )
                                      },
                                      IfError(
                                          UpdateIf(
                                              Tx_Travaux,
                                              Poste.Value = varQuart && IsBlank(Heures_Degagement),
                                              {Poste: {Value: _nextPoste}}
                                          );
                                          UpdateIf(
                                              Tx_LTV,
                                              'Poste '.Value = varQuart && Statut_LTV.Value = "Imposée",
                                              {'Poste ': {Value: _nextPoste}}
                                          );
                                          UpdateIf(
                                              Tx_incidents_Ruptures,
                                              Poste.Value = varQuart && (Etat.Value = "En cours" || IsBlank(Heure_Fin)),
                                              {Poste: {Value: _nextPoste}}
                                          );
                                          Set(
                                              varAgentCloture,
                                              Patch(
                                                  Ref_Permanents,
                                                  LookUp(Ref_Permanents, ID = varAgentPermanentID),
                                                  {'Actif ': {Value: "Non"}}
                                              )
                                          );
                                          If(
                                              varAgentCloture.'Actif '.Value = "Non",
                                              Refresh(Ref_Permanents);
                                              Refresh(Tx_Travaux);
                                              Refresh(Tx_LTV);
                                              Refresh(Tx_incidents_Ruptures);
                                              Set(varAgentPermanent, Blank());
                                              Set(varAgentPermanentID, Blank());
                                              Set(varAgentPermanentNom, Blank());
                                              Set(varEtapeCloture, 1);
                                              Notify(
                                                  "Poste clôturé. Événements transmis au " & _nextPoste & ". Sélectionnez le prochain permanent.",
                                                  NotificationType.Success
                                              );
                                              Navigate(scrIdentificationAgent, ScreenTransition.Fade),
                                              Notify(
                                                  "La clôture n'a pas été confirmée. Veuillez réessayer.",
                                                  NotificationType.Error
                                              )
                                          ),
                                          Notify(
                                              "Erreur lors de la clôture : " & FirstError.Message,
                                              NotificationType.Error
                                          )
                                      )
                                  )
                              )
                          )
                        Size: =If(App.Width < 760, 12, 14)
                        Text: =If(varEtapeCloture < 3, "CONTINUER ÉTAPE SUIVANTE  →", "VALIDER & CLÔTURER LE POSTE")
                        Width: =If(App.Width < 760, 300, 360)

      - LockTimer_CL:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            Duration: =600000
            OnTimerEnd: |-
              =If(
                  !varSessionVerrouillee && !IsBlank(varSessionPoste),
                  Set(varSessionVerrouillee, true);
                  Set(varLockSource, "Automatique");
                  Set(LockPinInvalid_CL, false);
                  Reset(LockPin_CL)
              )
            Repeat: =false
            Reset: =false
            Start: =!varSessionVerrouillee && !IsBlank(varSessionPoste)
            Visible: =false
            Height: =1
            Width: =1
      - LockOverlay_CL:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(8, 49, 126, 0.97)
            Height: =App.Height
            Visible: =varSessionVerrouillee
            Width: =App.Width
          Children:
            - LockTitle_CL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  Size: =If(App.Width < 760, 20, 28)
                  Text: ="POSTE VERROUILLÉ"
                  Width: =Min(App.Width - 32, 640)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.34
            - LockInfo_CL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =54
                  Size: =If(App.Width < 760, 11, 15)
                  Text: =If(varLockSource = "Automatique", "Verrouillage automatique après 10 minutes d'inactivité. ", "Verrouillage manuel. ") & "Saisissez le PIN du permanent principal ou du deuxième permanent déclaré."
                  Width: =Min(App.Width - 32, 720)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.43
            - LockPin_CL:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="PIN de déverrouillage"
                  BorderColor: =RGBA(180, 185, 195, 1)
                  Default: =""
                  HintText: ="Code PIN"
                  MaxLength: =4
                  Mode: =TextMode.Password
                  Size: =If(App.Width < 760, 14, 18)
                  Width: =Min(App.Width - 48, 360)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.53
            - LockError_CL:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 190, 190, 1)
                  Font: =Font.'Segoe UI'
                  Height: =32
                  Size: =If(App.Width < 760, 10, 13)
                  Text: ="Code PIN incorrect ou permanent non autorisé."
                  Visible: =LockPinInvalid_CL
                  Width: =Min(App.Width - 32, 600)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.61
            - BtnUnlock_CL:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(255, 174, 0, 1)
                  Color: =RGBA(8, 49, 120, 1)
                  Fill: =RGBA(255, 174, 0, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =48
                  OnSelect: |-
                    =Set(
                        varPermanentAutoriseDeverrouillage,
                        LookUp(
                            Ref_Permanents,
                            (ID = varAgentPermanentID ||
                             (!IsBlank(varPermanentSecondaireSession.ID) &&
                              ID = varPermanentSecondaireSession.ID)) &&
                            CodePIN = Trim(LockPin_CL.Text)
                        )
                    );
                    If(
                        IsBlank(varPermanentAutoriseDeverrouillage.ID),
                        Set(LockPinInvalid_CL, true);
                        Notify("Code PIN incorrect ou permanent non autorisé.", NotificationType.Error),
                        Set(LockPinInvalid_CL, false);
                        Set(varSessionVerrouillee, false);
                        Reset(LockTimer_CL);
                        Reset(LockPin_CL);
                        Notify("Poste déverrouillé. Votre session est conservée.", NotificationType.Success)
                    )
                  Size: =If(App.Width < 760, 11, 14)
                  Text: ="DÉVERROUILLER LE POSTE"
                  Width: =Min(App.Width - 48, 360)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.69