                                      "• Incidents ouverts : " & CountRows(Filter(Tx_incidents_Ruptures, Poste.Value = varQuart && (Etat.Value = "En cours" || IsBlank(Heure_Fin))))
                              - LockNotice_5:
                                  Control: Label@2.5.1
