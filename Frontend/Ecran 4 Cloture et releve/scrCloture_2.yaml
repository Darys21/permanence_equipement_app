      - ValidateClosure_4:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =RGBA(255, 174, 0, 1)
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =38
            OnSelect: |-
              =If(
                  varEtapeCloture < 3,
                  Set(varEtapeCloture, varEtapeCloture + 1),
                  If(
                      IsBlank(varAgentPermanentID),
                      Notify(
                          "Impossible de clôturer : aucun permanent connecté n'a été identifié.",
                          NotificationType.Error
                      ),
                      With(
                          {
                              _nextPoste: If(
                                  !IsBlank(NextShift_4.Selected) && StartsWith(Text(NextShift_4.Selected.Value), "P3"),
                                  "P3",
                                  If(
                                      !IsBlank(NextShift_4.Selected) && StartsWith(Text(NextShift_4.Selected.Value), "P2"),
                                      "P2",
                                      If(
                                          !IsBlank(NextShift_4.Selected) && StartsWith(Text(NextShift_4.Selected.Value), "P1"),
                                          "P1",
                                          Switch(varQuart, "P1", "P2", "P2", "P3", "P3", "P1", "P1")
                                      )
                                  )
                              )
                          },
                          IfError(
                              UpdateIf(
                                  Tx_Travaux,
                                  Poste.Value = varQuart && IsBlank(Heures_Degagement),
                                  {Poste: {Value: _nextPoste}}
                              );
                              UpdateIf(
                                  Tx_LTV,
                                  'Poste '.Value = varQuart && Statut_LTV.Value = "Imposée",
                                  {'Poste ': {Value: _nextPoste}}
                              );
                              UpdateIf(
                                  Tx_incidents_Ruptures,
                                  Poste.Value = varQuart && (Etat.Value = "En cours" || IsBlank(Heure_Fin)),
                                  {Poste: {Value: _nextPoste}}
                              );
                              Set(
                                  varAgentCloture,
                                  Patch(
                                      Ref_Permanents,
                                      LookUp(Ref_Permanents, ID = varAgentPermanentID),
                                      {'Actif ': {Value: "Non"}}
                                  )
                              );
                              If(
                                  varAgentCloture.'Actif '.Value = "Non",
                                  Refresh(Ref_Permanents);
                                  Refresh(Tx_Travaux);
                                  Refresh(Tx_LTV);
                                  Refresh(Tx_incidents_Ruptures);
                                  Set(varAgentPermanent, Blank());
                                  Set(varAgentPermanentID, Blank());
                                  Set(varAgentPermanentNom, Blank());
                                  Set(varEtapeCloture, 1);
                                  Notify(
                                      "Poste clôturé. Événements transmis au " & _nextPoste & ". Sélectionnez le prochain permanent.",
                                      NotificationType.Success
                                  );
                                  Navigate(scrIdentificationAgent, ScreenTransition.Fade),
                                  Notify(
                                      "La clôture n'a pas été confirmée. Veuillez réessayer.",
                                      NotificationType.Error
                                  )
                              ),
                              Notify(
                                  "Erreur lors de la clôture : " & FirstError.Message,
                                  NotificationType.Error
                              )
                          )
                      )
                  )
              )
            PaddingRight: =7.01
            PaddingTop: =7.01
            Size: =18.29
            Text: =If(varEtapeCloture < 3, "CONTINUER ÉTAPE SUIVANTE  →", "VALIDER & CLÔTURER LE POSTE")
            Width: =444.16
            X: =1443.51
            Y: =730
