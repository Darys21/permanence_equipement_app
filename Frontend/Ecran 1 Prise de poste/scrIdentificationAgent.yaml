Screens:
  scrIdentificationAgent:
    Properties:
      Fill: =RGBA(248, 249, 251, 1)
      LoadingSpinnerColor: =RGBA(8, 49, 120, 1)
      OnVisible: |-
        =Refresh(Ref_Permanents);
        Set(varIDShowError, false);
        Set(varAgentAuthentifie, Blank());
        Reset(PinInput_ID_5);
        If(
            !IsBlank(varAgentPermanent),
            Set(
                varAgentPreselect,
                Filter(
                    Ref_Permanents,
                    ID = varAgentPermanent.ID
                )
            ),
            Set(varAgentPreselect, Blank())
        )
    Children:
      - conRoot_ID:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            Width: =App.Width
            X: =0
            Y: =0
            Fill: =RGBA(248, 249, 251, 1)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutMinHeight: =16
            LayoutMinWidth: =16
          Children:
            - Header_ID_6:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(8, 49, 120, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 600, 68, 90)
                  Width: =Parent.Width
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =60
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 600, 12, 24)
                  PaddingRight: =If(App.Width < 600, 12, 24)
                  PaddingTop: =8
                Children:
                  - Image2:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =If(App.Width < 600, 48, 72)
                        Image: ='id-uWjB6m6_logos'
                        ImagePosition: =ImagePosition.Fit
                        LayoutMinHeight: =40
                        LayoutMinWidth: =72
                        Width: =If(App.Width < 600, 150, 240)
                  - ScreenTitle_ID_6:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height
                        LayoutMinHeight: =40
                        LayoutMinWidth: =100
                        Size: =If(App.Width < 600, 16, If(App.Width < 900, 20, 26))
                        Text: ="IDENTIFICATION AGENT"
                        Width: =Parent.Width
            - conMain_ID:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  FillPortions: =1
                  Height: =Parent.Height - Header_ID_6.Height
                  Width: =Parent.Width
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 760, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =If(App.Width < 760, 8, 24)
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(App.Width < 600, 12, 24)
                  PaddingLeft: =If(App.Width < 600, 12, 24)
                  PaddingRight: =If(App.Width < 600, 12, 24)
                  PaddingTop: =If(App.Width < 600, 12, 24)
                Children:
                  - Image1:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 48, 84, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =3
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        FillPortions: =If(App.Width < 760, 0, 1)
                        Height: =If(App.Width < 760, 0, Parent.Height)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =Transgabonais_LUnion
                        ImagePosition: =ImagePosition.Fill
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Visible: =App.Width >= 760
                        Width: =Parent.Width
                  - Card_ID_6:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(App.Width < 760, 1, 1)
                        Height: =Parent.Height
                        Width: =If(App.Width < 760, Parent.Width, Parent.Width * 0.48)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =If(App.Width < 600, 10, 14)
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =400
                        LayoutMinWidth: =280
                        PaddingBottom: =If(App.Width < 600, 16, 32)
                        PaddingLeft: =If(App.Width < 600, 16, 40)
                        PaddingRight: =If(App.Width < 600, 16, 40)
                        PaddingTop: =If(App.Width < 600, 16, 32)
                      Children:
                        - Image2_1:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =If(App.Width < 600, 48, 64)
                              Image: ='id-uWjB6m6_logos'
                              ImagePosition: =ImagePosition.Fit
                              LayoutMinHeight: =40
                              LayoutMinWidth: =100
                              Width: =Parent.Width
                        - CardTitle_ID_6:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              LayoutMinHeight: =32
                              LayoutMinWidth: =100
                              Size: =If(App.Width < 600, 18, 22)
                              Text: ="Permanence Équipement"
                              Width: =Parent.Width
                        - CardRule_ID_6:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(255, 174, 0, 1)
                              Height: =3
                              LayoutMinHeight: =3
                              LayoutMinWidth: =16
                              Width: =Parent.Width
                        - CardHint_ID_6:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(83, 87, 99, 1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width < 600, 64, 50)
                              LayoutMinHeight: =48
                              LayoutMinWidth: =100
                              Size: =If(App.Width < 600, 12, 15)
                              Text: ="Sélectionnez votre nom et saisissez votre code PIN personnel pour accéder à la permanence."
                              Width: =Parent.Width
                        - AgentLabel_ID_6:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinHeight: =24
                              LayoutMinWidth: =100
                              Size: =14
                              Text: ="Agent de permanence"
                              Width: =Parent.Width
                        - AgentCombo_ID_6:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              AccessibleLabel: ="Sélectionner votre nom"
                              BorderColor: =RGBA(180, 185, 195, 1)
                              DefaultSelectedItems: =varAgentPreselect
                              DisplayFields: =["Title"]
                              InputTextPlaceholder: ="Choisir votre nom..."
                              Items: |+
                                =SortByColumns(
                                    Ref_Permanents,
                                    "Title",
                                    SortOrder.Ascending
                                )
                              SearchFields: =["CodePIN"]
                              SelectMultiple: =false
                              Size: =If(App.Width < 600, 14, 18)
                              LayoutMinHeight: =44
                              LayoutMinWidth: =100
                              Width: =Parent.Width
                        - PinLabel_ID_5:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinHeight: =24
                              LayoutMinWidth: =100
                              Size: =14
                              Text: ="Code PIN personnel"
                              Width: =Parent.Width
                        - PinInput_ID_5:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Saisir votre code PIN personnel"
                              BorderColor: =RGBA(180, 185, 195, 1)
                              Default: =""
                              HintText: ="Saisir votre code PIN..."
                              MaxLength: =4
                              Mode: =TextMode.Password
                              Size: =If(App.Width < 600, 14, 18)
                              LayoutMinHeight: =44
                              LayoutMinWidth: =100
                              Width: =Parent.Width
                        - ErrorLabel_ID_6:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(238, 32, 35, 1)
                              Font: =Font.'Segoe UI'
                              Height: =If(varIDShowError, 35, 0)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =100
                              Size: =12
                              Text: ="Nom ou code PIN incorrect. Vérifiez vos informations."
                              Visible: =varIDShowError
                              Width: =Parent.Width
                        - BtnValider_ID_6:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Fill: =RGBA(255, 174, 0, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =52
                              LayoutMinHeight: =48
                              LayoutMinWidth: =100
                              OnSelect: |-
                                =Set(varIDShowError, false);
                                If(
                                    IsBlank(AgentCombo_ID_6.Selected.ID) ||
                                    IsBlank(Trim(PinInput_ID_5.Text)),
                                    Set(varIDShowError, true),
                                    Set(
                                        varAgentAuthentifie,
                                        LookUp(
                                            Ref_Permanents,
                                            ID = AgentCombo_ID_6.Selected.ID &&
                                            CodePIN = Trim(PinInput_ID_5.Text)
                                        )
                                    );
                                    If(
                                        IsBlank(varAgentAuthentifie.ID),
                                        Set(varIDShowError, true),
                                        UpdateIf(
                                            Ref_Permanents,
                                            'Actif '.Value = "Oui" &&
                                            ID <> varAgentAuthentifie.ID,
                                            {'Actif ': {Value: "Non"}}
                                        );
                                        Set(
                                            varAgentPermanent,
                                            Patch(
                                                Ref_Permanents,
                                                LookUp(
                                                    Ref_Permanents,
                                                    ID = varAgentAuthentifie.ID
                                                ),
                                                {'Actif ': {Value: "Oui"}}
                                            )
                                        );
                                        Set(
                                            varAgentPermanentNom,
                                            varAgentPermanent.Titre
                                        );
                                        Set(
                                            varAgentPermanentID,
                                            varAgentPermanent.ID
                                        );
                                        Set(varIDShowError, false);
                                        Reset(PinInput_ID_5);
                                        Refresh(Ref_Permanents);
                                        Navigate(
                                            PrisePoste_2,
                                            ScreenTransition.Fade
                                        )
                                    )
                                )
                              Size: =If(App.Width < 600, 13, 17)
                              Text: ="VALIDER ET PRENDRE LE POSTE"
                              Width: =Parent.Width
                        - SessionHint_ID_6:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(140, 145, 155, 1)
                              Font: =Font.'Segoe UI'
                              Height: =30
                              LayoutMinHeight: =24
                              LayoutMinWidth: =100
                              Size: =11
                              Text: |-
                                ="Session technique : " & User().Email
                              Width: =Parent.Width
