Screens:
  scrIdentificationAgent:
    Properties:
      BackgroundImage: ='Bannière ferroviaire corporate Setrag'
      Fill: =RGBA(248, 249, 251, 1)
      ImagePosition: =ImagePosition.Stretch
      LoadingSpinnerColor: =RGBA(8, 49, 120, 1)
      OnVisible: |-
        =Refresh(Ref_Permanents);
        Set(varIDShowError, false);
        Set(varAgentAuthentifie, Blank());
        Reset(PinInput_ID_7);
        If(
            !IsBlank(varAgentPermanent),
            Set(
                varAgentPreselect,
                Filter(
                    Ref_Permanents,
                    ID = varAgentPermanent.ID
                )
            ),
            Set(varAgentPreselect, Blank())
        )
    Children:
      - BgImage_ID:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Fond Transgabonais"
            BorderStyle: =BorderStyle.None
            Height: =App.Height
            Image: =Fond_Identification
            ImagePosition: =ImagePosition.Fill
            Visible: =App.Width >= 760
            Width: =App.Width
      - conRoot_ID_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =App.Width
          Children:
            - Header_ID_8:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =If(App.Width < 760, RGBA(8, 49, 120, 1), RGBA(0, 0, 0, 0))
                  FillPortions: =0
                  Height: |-
                    =If(App.Width < 760, 68, With({_s: Max(App.Width / 1672, App.Height / 941)}, Max(56, 110 * _s - Max(0, (941 * _s - App.Height) / 2))))
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                Children:
                  - Image2_4:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =48
                        Image: ='id-uWjB6m6_logos'
                        Visible: =App.Width < 760
                        Width: =120
                  - ScreenTitle_ID_8:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =48
                        LayoutMinWidth: =0
                        Size: =14
                        Text: ="IDENTIFICATION AGENT"
                        Visible: =App.Width < 760
            - conMain_ID_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 760, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =If(App.Width < 760, 0, 24)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(App.Width < 760, 0, 24)
                  PaddingLeft: =If(App.Width < 760, 0, 32)
                  PaddingRight: =If(App.Width < 760, 0, 32)
                  PaddingTop: =If(App.Width < 760, 0, 16)
                Children:
                  - Image1_2:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 48, 84, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =3
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =150
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =Transgabonais_LUnion
                        ImagePosition: =ImagePosition.Fill
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Visible: =App.Width < 760
                  - LeftPane_ID:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinWidth: =0
                        PaddingBottom: =40
                        PaddingLeft: =16
                        Visible: =App.Width >= 760
                      Children:
                        - Tagline1_ID:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width < 1000, 56, 84)
                              Italic: =true
                              Size: =If(App.Width < 1000, 20, 30)
                              Text: ="Ensemble pour une exploitation"
                        - Tagline2_ID:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 174, 0, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =If(App.Width < 1000, 32, 44)
                              Italic: =true
                              Size: =If(App.Width < 1000, 20, 30)
                              Text: ="sûre et performante"
                        - TagRuleRow_ID:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =4
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =4
                            Children:
                              - TagRule_ID:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =RGBA(255, 174, 0, 1)
                                    Height: =4
                                    LayoutMinWidth: =200
                                    Width: =200
                  - RightPane_ID:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =If(App.Width < 760, 1, 0)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinWidth: =300
                        Width: =If(App.Width < 760, Parent.Width, Max(340, Min(560, App.Width * 0.42)))
                      Children:
                        - Card_ID_8:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =If(App.Width < 760, 1, 0)
                              Height: =If(App.Width < 760, Parent.Height, Min(Parent.Height, 600))
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =If(App.Width < 600, 8, 10)
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =400
                              LayoutMinWidth: =280
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =If(App.Width < 600, 16, 24)
                              PaddingLeft: =If(App.Width < 600, 16, 40)
                              PaddingRight: =If(App.Width < 600, 16, 40)
                              PaddingTop: =If(App.Width < 600, 16, 20)
                              RadiusBottomLeft: =If(App.Width < 760, 0, 16)
                              RadiusBottomRight: =If(App.Width < 760, 0, 16)
                              RadiusTopLeft: =If(App.Width < 760, 0, 16)
                              RadiusTopRight: =If(App.Width < 760, 0, 16)
                            Children:
                              - Image2_5:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =If(App.Width < 600, 48, 60)
                                    Image: ='id-uWjB6m6_logos'
                              - CardTitle_ID_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(8, 49, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =If(App.Width < 760, 40, 48)
                                    Size: =If(App.Width < 760, 26, 34)
                                    Text: ="Bienvenue"
                              - CardHint_ID_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(83, 87, 99, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =If(App.Width < 600, 64, 56)
                                    Size: =14
                                    Text: ="Identifiez-vous pour accéder à l'application Permanence Équipement."
                              - RuleRow_ID:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =4
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =4
                                  Children:
                                    - CardRule_ID_8:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =RGBA(255, 174, 0, 1)
                                          Height: =4
                                          LayoutMinWidth: =70
                                          Width: =70
                              - AgentLabel_ID_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Text: ="Agent de permanence"
                              - AgentField_ID:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =48
                                    LayoutMinHeight: =48
                                  Children:
                                    - AgentCombo_ID_8:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Sélectionner votre nom"
                                          BorderColor: =RGBA(180, 185, 195, 1)
                                          ChevronBackground: =RGBA(8, 49, 120, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverBackground: =RGBA(5, 36, 92, 1)
                                          ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                          DefaultSelectedItems: =varAgentPreselect
                                          DisplayFields: =["Title"]
                                          Height: =Parent.Height
                                          InputTextPlaceholder: ="Choisir votre nom..."
                                          Items: |
                                            =SortByColumns(
                                                Ref_Permanents,
                                                "Title",
                                                SortOrder.Ascending
                                            )
                                          PaddingLeft: =44
                                          SearchFields: =["CodePIN"]
                                          SelectMultiple: =false
                                          Size: =15
                                          Width: =Parent.Width
                                    - AgentIcon_ID:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AccessibleLabel: ="Icône"
                                          Color: =RGBA(8, 49, 120, 1)
                                          Height: =24
                                          Icon: =Icon.Person
                                          OnSelect: =Select(AgentCombo_ID_8)
                                          Width: =24
                                          X: =12
                                          Y: =12
                              - PinLabel_ID_7:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Text: ="Code PIN personnel"
                              - PinField_ID:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =48
                                    LayoutMinHeight: =48
                                  Children:
                                    - PinInput_ID_7:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          AccessibleLabel: ="Saisir votre code PIN personnel"
                                          BorderColor: =RGBA(180, 185, 195, 1)
                                          Default: =""
                                          Height: =Parent.Height
                                          HintText: ="Saisir votre code PIN..."
                                          MaxLength: =4
                                          Mode: =TextMode.Password
                                          PaddingLeft: =44
                                          Size: =15
                                          Width: =Parent.Width
                                    - PinIcon_ID:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AccessibleLabel: ="Icône"
                                          Color: =RGBA(8, 49, 120, 1)
                                          Height: =24
                                          Icon: =Icon.Lock
                                          OnSelect: =Select(PinInput_ID_7)
                                          Width: =24
                                          X: =12
                                          Y: =12
                              - ErrorLabel_ID_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(238, 32, 35, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =If(varIDShowError, 32, 0)
                                    LayoutMinHeight: =0
                                    Size: =12
                                    Text: ="Nom ou code PIN incorrect. Vérifiez vos informations."
                                    Visible: =varIDShowError
                              - BtnValider_ID_8:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(8, 49, 120, 1)
                                    Fill: =RGBA(255, 174, 0, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =52
                                    HoverFill: =RGBA(255, 196, 43, 1)
                                    LayoutMinHeight: =48
                                    OnSelect: |-
                                      =Set(varIDShowError, false);

                                      // 1. Validation des champs obligatoires
                                      If(
                                          IsBlank(AgentCombo_ID_8.Selected.ID) ||
                                          IsBlank(Trim(PinInput_ID_7.Text)),

                                          Set(varIDShowError, true),

                                          // 2. Recherche de l'agent
                                          Set(
                                              varAgentAuthentifie,
                                              LookUp(
                                                  Ref_Permanents,
                                                  ID = AgentCombo_ID_8.Selected.ID
                                              )
                                          );

                                          // 3. Vérification de l'existence et du PIN
                                          If(
                                              IsBlank(varAgentAuthentifie) ||
                                              varAgentAuthentifie.CodePIN <> Trim(PinInput_ID_7.Text),

                                              Set(varIDShowError, true),

                                              // 4. Désactivation des autres agents actifs
                                              UpdateIf(
                                                  Ref_Permanents,
                                                  'Actif '.Value = "Oui" &&
                                                  ID <> varAgentAuthentifie.ID,
                                                  {'Actif ': {Value: "Non"}}
                                              );

                                              // 5. Activation de l'agent authentifié
                                              Set(
                                                  varAgentPermanent,
                                                  Patch(
                                                      Ref_Permanents,
                                                      varAgentAuthentifie,
                                                      {'Actif ': {Value: "Oui"}}
                                                  )
                                              );

                                              // 6. Mise à jour des variables globales
                                              Set(varAgentPermanentNom, varAgentPermanent.Titre);
                                              Set(varAgentPermanentID, varAgentPermanent.ID);

                                              // 7. Nettoyage et navigation
                                              Reset(PinInput_ID_7);
                                              Navigate(
                                                  PrisePoste_2,
                                                  ScreenTransition.Fade
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =14
                                    Text: ="VALIDER ET PRENDRE LE POSTE"
                              - AssistHint_ID:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(8, 49, 120, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =26
                                    Italic: =true
                                    Size: =10
                                    Text: ="Besoin d'assistance ? Contactez votre référent du bureau methode DMI"
                              - SessionHint_ID_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(140, 145, 155, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =24
                                    Size: =10
                                    Text: |-
                                      ="Session technique : " & User().Email
