                                          LayoutMinWidth: =120
                                          Size: =11
                                          Text: ="En cas de difficulté, contactez votre référent."
                              - StartButton_10:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(255, 184, 0, 1)
                                    BorderThickness: =1
                                    Color: =RGBA(16, 54, 117, 1)
                                    DisplayMode: =If(_demarrageEnCours, DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(255, 184, 0, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =54
                                    HoverBorderColor: =RGBA(230, 163, 0, 1)
                                    HoverFill: =RGBA(230, 163, 0, 1)
                                    LayoutMinHeight: =54
                                    LayoutMinWidth: =If(App.Width < 760, 260, 320)
                                    OnSelect: |-
                                      =Reset(LockTimer_PO_1);
                                      If(
                                          IsBlank(varAgentPermanentID),
                                          Notify(
                                              "Aucun permanent identifié. Veuillez vous reconnecter.",
                                              NotificationType.Error
                                          ),
                                          If(
                                              IsBlank(varQuart),
                                              Notify(
                                                  "Veuillez sélectionner un poste avant de commencer.",
                                                  NotificationType.Warning
                                              ),
                                              If(
                                                  _demarrageEnCours,
                                                  Notify(
                                                      "Démarrage déjà en cours, veuillez patienter.",
                                                      NotificationType.Information
                                                  ),
                                                  UpdateContext({_demarrageEnCours: true});
                                                  IfError(
                                                      With(
                                                          {
                                                              _cand: Filter(
                                                                  Tx_SessionsPermanence,
                                                                  StatutSession.Value = "En cours",
                                                                  Poste.Value = varQuart,
                                                                  DateDebut >= DateAdd(Now(), -12, TimeUnit.Hours)
                                                              )
                                                          },
                                                          With(
                                                              {
                                                                  _mienne: First(
                                                                      Sort(
                                                                          Filter(
                                                                              _cand,
                                                                              PermanentPrincipalID = varAgentPermanentID || PermanentSecondaireID = varAgentPermanentID
                                                                          ),
                                                                          DateDebut,
                                                                          SortOrder.Descending
                                                                      )
                                                                  ),
                                                                  _libre: First(
                                                                      Sort(
                                                                          Filter(
                                                                              _cand,
                                                                              IsBlank(PermanentSecondaireID)
                                                                          ),
                                                                          DateDebut,
                                                                          SortOrder.Descending
                                                                      )
                                                                  )
                                                              },
                                                              If(
                                                                  !IsBlank(_mienne),
                                                                  Set(varSessionPoste, _mienne),
                                                                  !IsBlank(_libre),
                                                                  Set(
                                                                      varSessionPoste,
                                                                      Patch(
                                                                          Tx_SessionsPermanence,
                                                                          _libre,
                                                                          {
                                                                              PermanentSecondaireID: varAgentPermanentID,
                                                                              PermanentSecondaireNom: varAgentPermanentNom
                                                                          }
                                                                      )
                                                                  ),
                                                                  CountRows(_cand) > 0,
                                                                  Error({Kind: ErrorKind.Custom, Message: "La session " & varQuart & " est déjà associée à deux autres permanents."}),
                                                                  If(
                                                                      !IsBlank(
                                                                          LookUp(
                                                                              Tx_SessionsPermanence,
                                                                              StatutSession.Value = "En cours" && Poste.Value = varQuart && DateDebut < DateAdd(Now(), -12, TimeUnit.Hours)
                                                                          )
                                                                      ),
                                                                      Notify(
                                                                          "Une session " & varQuart & " de plus de 12 h n'a pas été clôturée : elle n'est pas reprise. Pensez à la clôturer.",
                                                                          NotificationType.Warning
                                                                      )
                                                                  );
                                                                  Set(
                                                                      varSessionPoste,
                                                                      Patch(
                                                                          Tx_SessionsPermanence,
                                                                          Defaults(Tx_SessionsPermanence),
                                                                          {
                                                                              Title: varQuart & " - " & Text(Today(), "dd/mm/yyyy") & " - " & varAgentPermanentNom,
                                                                              DateDebut: Now(),
                                                                              Poste: {Value: varQuart},
                                                                              PermanentPrincipalID: varAgentPermanentID,
                                                                              PermanentPrincipalNom: varAgentPermanentNom,
                                                                              StatutSession: {Value: "En cours"}
                                                                          }
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      );
                                                      If(
                                                          IsBlank(varSessionPoste.ID),
                                                          Error({Kind: ErrorKind.Custom, Message: "Session introuvable après création."})
                                                      );
                                                      Set(varPermanentPrincipalSession, LookUp(Ref_Permanents, ID = varSessionPoste.PermanentPrincipalID));
                                                      Set(
                                                          varPermanentSecondaireSession,
                                                          If(
                                                              IsBlank(varSessionPoste.PermanentSecondaireID),
                                                              Blank(),
                                                              LookUp(Ref_Permanents, ID = varSessionPoste.PermanentSecondaireID)
                                                          )
                                                      );
                                                      Set(varSessionVerrouillee, false);
                                                      Set(LockPinInvalid_PO, false);
                                                      UpdateContext({_demarrageEnCours: false});
                                                      Navigate(
                                                          JournalDeBord_3,
                                                          ScreenTransition.Fade
                                                      ),
                                                      UpdateContext({_demarrageEnCours: false});
                                                      Notify(
                                                          "Démarrage impossible : " & FirstError.Message,
                                                          NotificationType.Error
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =25
                                    RadiusBottomRight: =25
                                    RadiusTopLeft: =25
                                    RadiusTopRight: =25
                                    Size: =13
                                    Text: ="✔  VALIDER MA PRISE DE POSTE  ›"
      - LockTimer_PO_1:
          Control: Timer@2.1.0
          Properties:
            Duration: =600000
            Height: =1
            OnTimerEnd: |-
              =If(
                  !varSessionVerrouillee && !IsBlank(varSessionPoste),
                  Set(varSessionVerrouillee, true);
                  Set(varLockSource, "Automatique");
                  Set(LockPinInvalid_PO, false);
                  Reset(LockPin_PO_2)
              )
            Start: =!varSessionVerrouillee && !IsBlank(varSessionPoste)
            Visible: =false
            Width: =1
      - LockOverlay_PO_2:
