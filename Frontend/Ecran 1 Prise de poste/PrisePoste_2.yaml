Screens:
  PrisePoste_2:
    Properties:
      BackgroundImage: ='prise de'
      Fill: =RGBA(243, 245, 249, 1)
      ImagePosition: =ImagePosition.Fill
      LoadingSpinnerColor: =RGBA(11, 56, 126, 1)
      OnVisible: |-
        =Reset(LockTimer_PO_1);
        If(
            IsBlank(varAgentPermanentID) || IsBlank(varAgentPermanentNom),
            Navigate(scrIdentificationAgent, ScreenTransition.Fade),
            Refresh(Ref_Cantons);
            Refresh(Ref_Acteurs);
            Refresh(Ref_Permanents);
            Refresh(Tx_Travaux);
            Refresh(Tx_LTV);
            Refresh(Tx_incidents_Ruptures);
            Refresh(Tx_Feedbacks);

            Set(
                varQuartSuggere,
                If(
                    Hour(Now()) >= 6 && Hour(Now()) < 14,
                    "P1",
                    If(
                        Hour(Now()) >= 14 && Hour(Now()) < 22,
                        "P2",
                        "P3"
                    )
                )
            );

            If(
                IsBlank(varQuart),
                Set(varQuart, varQuartSuggere)
            );

            UpdateContext({_demarrageEnCours: false});
            Set(varSecTravaux, true);
            Set(varSecLTV, false);
            Set(varSecInc, false);
            Set(varActionEnCours, "Créer");
            Set(varRecordToEdit, Blank());
            Set(varTravauxToEdit, Blank());
            Set(varLtvToEdit, Blank());
            Set(varIncidentToEdit, Blank())
        )
    Children:
      - BgImage_PO_1:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Fond Permanence Équipement"
            BorderStyle: =BorderStyle.None
            Height: =App.Height
            Image: =Fond_PrisePoste
            ImagePosition: =ImagePosition.Fill
            Visible: =App.Width >= 760
            Width: =App.Width
