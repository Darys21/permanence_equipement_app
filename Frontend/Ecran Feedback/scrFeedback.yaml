Screens:
  scrFeedback:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(8, 49, 120, 1)
      OnVisible: |-
        =Reset(LockTimer_FB);
        Refresh(Tx_Travaux);
        Refresh(Tx_Feedbacks);
        Refresh(Ref_Cantons);
        Refresh(Ref_Acteurs);
        If(
            IsBlank(varFeedbackEvent),
            Set(
                varFeedbackEvent,
                First(
                    SortByColumns(
                        Filter(Tx_Travaux, Poste.Value = varQuart && Date_travaux = Today()),
                        "Created",
                        SortOrder.Descending
                    )
                )
            )
        )
    Children:
      - conRoot_FB:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingLeft: =If(App.Width < 760, 12, 24)
            PaddingRight: =If(App.Width < 760, 12, 24)
            PaddingTop: =12
            Width: =App.Width
          Children:
            - FeedbackHeader_4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(8, 49, 120, 1)
                  FillPortions: =0
                  Height: =76
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(App.Width < 760, 8, 16)
                  LayoutMinHeight: =76
                  PaddingLeft: =If(App.Width < 760, 12, 20)
                  PaddingRight: =If(App.Width < 760, 12, 20)
                Children:
                  - FbLogoGroup_2:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =0
                        Height: =60
                        LayoutMinWidth: =If(App.Width < 760, 70, 200)
                        Width: =If(App.Width < 760, 70, 200)
                      Children:
                        - LogoMark_18:
                            Control: Rectangle@2.3.0
                            Properties:
                              AccessibleLabel: ="Logo SETRAG"
                              Fill: =RGBA(255, 184, 0, 1)
                              Height: =5
                              TabIndex: =0
                              Width: =59
                              Y: =22
                        - LogoText_22:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              TabIndex: =0
                              Text: ="SETRAG" & Char(10) & "   ERAMET"
                              Visible: =App.Width >= 760
                              Width: =130
                              X: =66
                              Y: =8
                        - HomeFromFeedback_4:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =2
                              Height: =Parent.Height
                              OnSelect: =Reset(LockTimer_FB); Navigate(PrisePoste_2, ScreenTransition.Fade)
                              Size: =4.01
                              Text: ="Retour à la prise de poste"
                              Tooltip: ="Retour à la prise de poste"
                              Width: =Parent.Width
                  - FbTitleBlock_2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =76
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinWidth: =0
                      Children:
                        - FeedbackTitle_4:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =If(App.Width < 760, 44, 34)
                              Size: =If(App.Width < 760, 12, 20)
                              TabIndex: =0
                              Text: ="NOUVEAU POINTAGE TERRAIN"
                        - FeedbackSubtitle_4:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Size: =12
                              TabIndex: =0
                              Text: ="Ajouter un pointage terrain"
                              Visible: =App.Width >= 760
                  - FeedbackSession_4:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(255, 255, 255, 1)
                        BorderThickness: =1
                        Color: =RGBA(255, 255, 255, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =44
                        Size: =If(App.Width < 760, 9, 13)
                        TabIndex: =0
                        Text: |-
                          ="Poste : " &
                          Coalesce(varQuart, "Non défini") &
                          "   |   Agent : " &
                          Coalesce(varAgentPermanentNom, "Aucun agent sélectionné")
                        Width: =If(App.Width < 760, 140, 340)
                  - BtnLock_FB:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(255, 174, 0, 1)
                        BorderThickness: =1
                        Color: =RGBA(8, 49, 120, 1)
                        Fill: =RGBA(255, 174, 0, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =34
                        LayoutMinWidth: =If(App.Width < 760, 84, 104)
                        OnSelect: |-
                          =Set(varSessionVerrouillee, true);
                          Set(varLockSource, "Manuel");
                          Set(LockPinInvalid_FB, false);
                          Reset(LockPin_FB)
                        Size: =If(App.Width < 760, 9, 11)
                        Text: =If(App.Width < 760, "VERROUILLER", "VERROUILLER LE POSTE")
                        Tooltip: ="Verrouiller la session sans la fermer"
                        Visible: =!IsBlank(varSessionPoste) && !varSessionVerrouillee
                        Width: =If(App.Width < 760, 84, 112)
            - FeedbackWorkspace_4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 1000, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =If(App.Width < 1000, 1400, 600)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                Children:
                  - InputPanel_4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(230, 232, 236, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(App.Width < 1000, 3, 55)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinWidth: =300
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                      Children:
                        - InputFlow_2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              LayoutWrap: =true
                              PaddingRight: =8
                            Children:
                              - EventHeading_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinWidth: =Parent.Width - 24
                                    TabIndex: =0
                                    Text: ="1. SÉLECTION DU CHANTIER CONCERNÉ"
                              - FldEvent_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =Parent.Width - 24
                                  Children:
                                    - EventLabel_4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Chantier concerné (poste en cours)"
                                    - EventSelector_4:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          AccessibleLabel: ="Chantier auquel rattacher le feedback"
                                          BorderColor: =RGBA(155, 163, 178, 1)
                                          DefaultSelectedItems: |-
                                            =If(
                                                !IsBlank(varFeedbackEvent),
                                                Filter(Tx_Travaux, ID = varFeedbackEvent.ID),
                                                Blank()
                                            )
                                          DisplayFields: =["Title"]
                                          Height: =38
                                          InputTextPlaceholder: ="Sélectionner un chantier"
                                          IsSearchable: =false
                                          Items: |-
                                            =SortByColumns(
                                                Filter(
                                                    Tx_Travaux,
                                                    Poste.Value = varQuart &&
                                                    (
                                                        Date_travaux = Today() ||
                                                        IsBlank(Heures_Degagement)
                                                    )
                                                ),
                                                "Created",
                                                SortOrder.Descending
                                            )
                                          OnChange: =Reset(LockTimer_FB); Set(varFeedbackEvent, EventSelector_4.Selected)
                                          SearchFields: =["Title"]
                                          SelectMultiple: =false
                              - EventContext_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    Fill: =RGBA(239, 245, 255, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    Height: =If(App.Width < 760, 64, 44)
                                    LayoutMinWidth: =Parent.Width - 24
                                    PaddingLeft: =8
                                    Size: =12
                                    TabIndex: =0
                                    Text: |-
                                      ="Type : Chantier    |    Date : " & Text(varFeedbackEvent.Date_travaux, "dd/mm/yyyy") &
                                      "    |    Resp. : " & Coalesce(
                                          LookUp(Ref_Acteurs, ID = varFeedbackEvent.'ActeurID ', Title),
                                          LookUp(Ref_Acteurs, ID = varFeedbackEvent.ActeurID, Title),
                                          "—"
                                      )
                              - PointageHeading_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinWidth: =Parent.Width - 24
                                    TabIndex: =0
                                    Text: ="2. INFORMATIONS DU POINTAGE"
                              - FldContactTime_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =290
                                  Children:
                                    - ContactTimeLabel_4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Heure du pointage *"
                                    - RowContactTime_2:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =38
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                        Children:
                                          - ContactTime_4:
                                              Control: Classic/DatePicker@2.6.0
                                              Properties:
                                                OnChange: =Reset(LockTimer_FB)
                                                AccessibleLabel: ="Date du pointage"
                                                BorderColor: =RGBA(155, 163, 178, 1)
                                                FillPortions: =1
                                                Format: ="dd/mm/yyyy"
                                                Height: =38
                                                LayoutMinWidth: =130
                                                Size: =13
                                          - ContactHour_4:
                                              Control: Classic/ComboBox@2.4.0
                                              Properties:
                                                OnChange: =Reset(LockTimer_FB)
                                                AccessibleLabel: ="Heure du pointage"
                                                BorderColor: =RGBA(155, 163, 178, 1)
                                                DisplayFields: =["Value"]
                                                Height: =38
                                                InputTextPlaceholder: ="hh"
                                                IsSearchable: =false
                                                Items: =Sequence(24, 0, 1)
                                                SearchFields: =["Value"]
                                                SelectMultiple: =false
                                                Width: =70
                                          - ContactMinute_4:
                                              Control: Classic/ComboBox@2.4.0
                                              Properties:
                                                OnChange: =Reset(LockTimer_FB)
                                                AccessibleLabel: ="Minute du pointage"
                                                BorderColor: =RGBA(155, 163, 178, 1)
                                                DisplayFields: =["Value"]
                                                Height: =38
                                                InputTextPlaceholder: ="mm"
                                                IsSearchable: =false
                                                Items: =Sequence(60, 0, 1)
                                                SearchFields: =["Value"]
                                                SelectMultiple: =false
                                                Width: =70
                              - FldContactMode_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                  Children:
                                    - ContactModeLabel_4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Mode de contact *"
                                    - ContactMode_4:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          OnChange: =Reset(LockTimer_FB)
                                          AccessibleLabel: ="Moyen de contact du pointage"
                                          BorderColor: =RGBA(155, 163, 178, 1)
                                          DisplayFields: =["Value"]
                                          Height: =38
                                          InputTextPlaceholder: ="Mode de contact"
                                          IsSearchable: =false
                                          Items: =["Sur place", "WhatsApp", "Téléphone", "Thuraya"]
                                          SearchFields: =["Value"]
                                          SelectMultiple: =false
                              - FldPK_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                  Children:
                                    - PKLabel_4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Localisation exacte (PK)"
                                    - PKInput_4:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          OnChange: =Reset(LockTimer_FB)
                                          AccessibleLabel: ="Localisation exacte du pointage en PK"
                                          BorderColor: =RGBA(155, 163, 178, 1)
                                          Default: =Blank()
                                          Height: =38
                                          HintText: |-
                                            ="ex: 12+400"
                              - FldContactStatus_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =68
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =220
                                  Children:
                                    - ContactStatusLabel_4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =11
                                          TabIndex: =0
                                          Text: ="Statut du contact *"
                                    - ContactStatus_4:
                                        Control: Classic/Radio@2.3.0
                                        Properties:
                                          OnChange: =Reset(LockTimer_FB)
                                          AccessibleLabel: ="Contact etabli (oui ou non)"
                                          BorderColor: =RGBA(155, 163, 178, 1)
                                          Height: =40
                                          Items: =["OUI", "NON"]
                                          Items.Value: =Value
                                          Layout: =Layout.Horizontal
                              - ObservationHeading_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(8, 49, 120, 1)
                                    FillPortions: =1
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinWidth: =Parent.Width - 24
                                    TabIndex: =0
                                    Text: ="3. OBSERVATIONS TERRAIN"
                              - FldObservation_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =150
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinWidth: =Parent.Width - 24
                                  Children:
                                    - ObservationInput_4:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          OnChange: =Reset(LockTimer_FB)
                                          AccessibleLabel: ="Observations du pointage terrain"
                                          BorderColor: =RGBA(155, 163, 178, 1)
                                          Default: =Blank()
                                          Height: =112
                                          HintText: ="Saisissez vos observations terrain..."
                                          MaxLength: =1000
                                          Mode: =TextMode.MultiLine
                                    - CharacterCount_4:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          Color: =RGBA(83, 87, 99, 1)
                                          FocusedBorderThickness: =2
                                          Height: =20
                                          Size: =10
                                          TabIndex: =0
                                          Text: =Len(ObservationInput_4.Text) & " / 1000"
                        - SaveRow_2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              PaddingTop: =8
                            Children:
                              - SaveFeedback_4:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Fill: =RGBA(255, 174, 0, 1)
                                    FillPortions: =If(App.Width < 760, 1, 0)
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    OnSelect: |-
                                      =Reset(LockTimer_FB);
                                      If(
                                          IsBlank(EventSelector_4.Selected) || IsBlank(varFeedbackEvent) || IsBlank(ContactMode_4.Selected) || IsBlank(ContactStatus_4.Selected),
                                          Notify("Sélectionnez un chantier, un mode et un statut de contact", NotificationType.Error),
                                          Patch(
                                              Tx_Feedbacks,
                                              Defaults(Tx_Feedbacks),
                                              {
                                                  TravailID: varFeedbackEvent.ID,
                                                  HeureContact: If(
                                                      Year(ContactTime_4.SelectedDate) < 2020 || IsBlank(ContactHour_4.Selected) || IsBlank(ContactMinute_4.Selected),
                                                      Blank(),
                                                      DateTime(
                                                          Year(ContactTime_4.SelectedDate),
                                                          Month(ContactTime_4.SelectedDate),
                                                          Day(ContactTime_4.SelectedDate),
                                                          Value(ContactHour_4.Selected.Value),
                                                          Value(ContactMinute_4.Selected.Value),
                                                          0
                                                      )
                                                  ),
                                                  MoyenCom: {Value: ContactMode_4.Selected.Value},
                                                  StatutContact: ContactStatus_4.Selected.Value = "OUI",
                                                  'Commentaire ': ObservationInput_4.Text,
                                                  PK: PKInput_4.Text,
                                                  Poste: {Value: varQuart},
                                                  AgentSaisie: {
                                                      Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                      DisplayName: User().FullName,
                                                      Email: User().Email,
                                                      Department: "",
                                                      JobTitle: "",
                                                      Picture: ""
                                                  },
                                                  DateSaisie: Now()
                                              }
                                          );
                                          Refresh(Tx_Feedbacks);
                                          Notify("Pointage ajouté avec succès", NotificationType.Success)
                                      )
                                    Size: =14
                                    Text: ="AJOUTER LE POINTAGE"
                                    Width: =280
                  - SummaryPanel_9:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(230, 232, 236, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(App.Width < 1000, 2, 45)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinWidth: =300
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                      Children:
                        - SummaryHeading_9:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinWidth: =0
                              TabIndex: =0
                              Text: ="RÉSUMÉ DU CHANTIER"
                        - SummaryCard_4:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(220, 224, 230, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =140
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =140
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                            Children:
                              - SummaryTitle_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(25, 28, 38, 1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Size: =14
                                    TabIndex: =0
                                    Text: =Coalesce(varFeedbackEvent.Title, "Aucun chantier sélectionné")
                              - SummaryDetails_3:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(83, 87, 99, 1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    Height: =48
                                    Size: =12
                                    TabIndex: =0
                                    Text: |-
                                      ="Canton : " & Coalesce(
                                          LookUp(Ref_Cantons, ID = varFeedbackEvent.'CantonID ', Titre),
                                          LookUp(Ref_Cantons, ID = varFeedbackEvent.CantonID, Titre),
                                          "—"
                                      ) & Char(10) &
                                      "Date : " & Text(varFeedbackEvent.Date_travaux, "dd/mm/yyyy") &
                                      "    |    PK : " & Coalesce(Text(varFeedbackEvent.PK_Debut), "—")
                              - SummaryStatus_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(IsBlank(varFeedbackEvent.Heures_Degagement), RGBA(237, 108, 20, 1), RGBA(18, 135, 43, 1))
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    Size: =12
                                    TabIndex: =0
                                    Text: =If(IsBlank(varFeedbackEvent), "—", If(IsBlank(varFeedbackEvent.Heures_Degagement), "En cours", "Dégagé"))
                        - HistoryHeading_3:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(8, 49, 120, 1)
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinWidth: =0
                              TabIndex: =0
                              Text: ="HISTORIQUE DES POINTAGES"
                        - HistoryGallery_4:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Historique des feedbacks"
                              BorderColor: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =2
                              Items: =SortByColumns(Filter(Tx_Feedbacks, TravailID = varFeedbackEvent.ID), "HeureContact", SortOrder.Descending)
                              LayoutMinHeight: =220
                              TabIndex: =0
                              TemplatePadding: =4
                              TemplateSize: =84
                            Children:
                              - HistoryTime_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    FocusedBorderThickness: =2
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    Size: =12
                                    TabIndex: =0
                                    Text: =Text(ThisItem.HeureContact, "dd/mm/yyyy hh:mm")
                                    Width: =Parent.TemplateWidth - 144
                                    X: =12
                                    Y: =6
                              - HistoryMode_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =RGBA(8, 49, 120, 1)
                                    FocusedBorderThickness: =2
                                    Height: =26
                                    Size: =11
                                    TabIndex: =0
                                    Text: =ThisItem.MoyenCom.Value
                                    Width: =120
                                    X: =Parent.TemplateWidth - Self.Width - 12
                                    Y: =6
                              - HistoryComment_4:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(83, 87, 99, 1)
                                    FocusedBorderThickness: =2
                                    Height: =44
                                    Size: =11
                                    TabIndex: =0
                                    Text: =Left(ThisItem.'Commentaire ', 70)
                                    Width: =Parent.TemplateWidth - 24
                                    X: =12
                                    Y: =34
            - Footer_FB:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 760, 112, 64)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 760, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =If(App.Width < 760, 112, 64)
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - BackToJournal_4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(8, 49, 120, 1)
                        BorderThickness: =1
                        Color: =RGBA(8, 49, 120, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =48
                        OnSelect: =Reset(LockTimer_FB); Navigate(JournalDeBord_3, ScreenTransition.Fade)
                        Size: =If(App.Width < 760, 12, 14)
                        Text: ="←   RETOUR AU JOURNAL DE BORD"
                        Width: =If(App.Width < 760, 300, 340)
                  - SaveAndClose_3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Fill: =RGBA(255, 174, 0, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =48
                        OnSelect: |-
                          =Reset(LockTimer_FB);
                          If(
                              IsBlank(EventSelector_4.Selected) || IsBlank(varFeedbackEvent) || IsBlank(ContactMode_4.Selected) || IsBlank(ContactStatus_4.Selected),
                              Notify("Sélectionnez un chantier, un mode et un statut de contact", NotificationType.Error),
                              Patch(
                                  Tx_Feedbacks,
                                  Defaults(Tx_Feedbacks),
                                  {
                                      TravailID: varFeedbackEvent.ID,
                                      HeureContact: If(
                                          Year(ContactTime_4.SelectedDate) < 2020 || IsBlank(ContactHour_4.Selected) || IsBlank(ContactMinute_4.Selected),
                                          Blank(),
                                          DateTime(
                                              Year(ContactTime_4.SelectedDate),
                                              Month(ContactTime_4.SelectedDate),
                                              Day(ContactTime_4.SelectedDate),
                                              Value(ContactHour_4.Selected.Value),
                                              Value(ContactMinute_4.Selected.Value),
                                              0
                                          )
                                      ),
                                      MoyenCom: {Value: ContactMode_4.Selected.Value},
                                      StatutContact: ContactStatus_4.Selected.Value = "OUI",
                                      'Commentaire ': ObservationInput_4.Text,
                                      PK: PKInput_4.Text,
                                      Poste: {Value: varQuart},
                                      AgentSaisie: {
                                          Claims: "i:0#.f|membership|" & Lower(User().Email),
                                          DisplayName: User().FullName,
                                          Email: User().Email,
                                          Department: "",
                                          JobTitle: "",
                                          Picture: ""
                                      },
                                      DateSaisie: Now()
                                  }
                              );
                              Refresh(Tx_Feedbacks);
                              Notify("Pointage enregistré", NotificationType.Success);
                              Navigate(JournalDeBord_3, ScreenTransition.Fade)
                          )
                        Size: =If(App.Width < 760, 12, 14)
                        Text: ="ENREGISTRER ET RETOUR JOURNAL"
                        Width: =If(App.Width < 760, 300, 350)

      - LockTimer_FB:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            Duration: =600000
            OnTimerEnd: |-
              =If(
                  !varSessionVerrouillee && !IsBlank(varSessionPoste),
                  Set(varSessionVerrouillee, true);
                  Set(varLockSource, "Automatique");
                  Set(LockPinInvalid_FB, false);
                  Reset(LockPin_FB)
              )
            Repeat: =false
            Reset: =false
            Start: =!varSessionVerrouillee && !IsBlank(varSessionPoste)
            Visible: =false
            Height: =1
            Width: =1
      - LockOverlay_FB:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(8, 49, 126, 0.97)
            Height: =App.Height
            Visible: =varSessionVerrouillee
            Width: =App.Width
          Children:
            - LockTitle_FB:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  Size: =If(App.Width < 760, 20, 28)
                  Text: ="POSTE VERROUILLÉ"
                  Width: =Min(App.Width - 32, 640)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.34
            - LockInfo_FB:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =54
                  Size: =If(App.Width < 760, 11, 15)
                  Text: =If(varLockSource = "Automatique", "Verrouillage automatique après 10 minutes d'inactivité. ", "Verrouillage manuel. ") & "Saisissez le PIN du permanent principal ou du deuxième permanent déclaré."
                  Width: =Min(App.Width - 32, 720)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.43
            - LockPin_FB:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="PIN de déverrouillage"
                  BorderColor: =RGBA(180, 185, 195, 1)
                  Default: =""
                  HintText: ="Code PIN"
                  MaxLength: =4
                  Mode: =TextMode.Password
                  Size: =If(App.Width < 760, 14, 18)
                  Width: =Min(App.Width - 48, 360)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.53
            - LockError_FB:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 190, 190, 1)
                  Font: =Font.'Segoe UI'
                  Height: =32
                  Size: =If(App.Width < 760, 10, 13)
                  Text: ="Code PIN incorrect ou permanent non autorisé."
                  Visible: =LockPinInvalid_FB
                  Width: =Min(App.Width - 32, 600)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.61
            - BtnUnlock_FB:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(255, 174, 0, 1)
                  Color: =RGBA(8, 49, 120, 1)
                  Fill: =RGBA(255, 174, 0, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =48
                  OnSelect: |-
                    =Set(
                        varPermanentAutoriseDeverrouillage,
                        LookUp(
                            Ref_Permanents,
                            (ID = varAgentPermanentID ||
                             (!IsBlank(varPermanentSecondaireSession.ID) &&
                              ID = varPermanentSecondaireSession.ID)) &&
                            CodePIN = Trim(LockPin_FB.Text)
                        )
                    );
                    If(
                        IsBlank(varPermanentAutoriseDeverrouillage.ID),
                        Set(LockPinInvalid_FB, true);
                        Notify("Code PIN incorrect ou permanent non autorisé.", NotificationType.Error),
                        Set(LockPinInvalid_FB, false);
                        Set(varSessionVerrouillee, false);
                        Reset(LockTimer_FB);
                        Reset(LockPin_FB);
                        Notify("Poste déverrouillé. Votre session est conservée.", NotificationType.Success)
                    )
                  Size: =If(App.Width < 760, 11, 14)
                  Text: ="DÉVERROUILLER LE POSTE"
                  Width: =Min(App.Width - 48, 360)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.69